#cloud-config
# ns1.runs-at.dev - GENERATED by infra/cloud-init/build.mjs; edit infra/powerdns or infra/monitoring instead.
# Contains no secrets: they are generated on the host or supplied by the operator.
hostname: ns1
package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - bind9-dnsutils
  - openssl
  - age
  - pdns-server
  - pdns-backend-pgsql
  - postgresql
  - postgresql-client
write_files:
  - path: /etc/powerdns/pdns.conf
    permissions: '0640'
    defer: true
    content: |
      # ns1.runs-at.dev - PowerDNS Authoritative, primary.
      # Secrets (gpgsql-password, api-key) are NOT here: setup-primary.sh writes
      # them at first boot to /etc/powerdns/pdns.d/secrets.conf (mode 0640).
      launch=gpgsql
      gpgsql-host=127.0.0.1
      gpgsql-port=5432
      gpgsql-dbname=pdns
      gpgsql-user=pdns
      gpgsql-dnssec=yes

      local-address=0.0.0.0, ::
      local-port=53

      primary=yes
      secondary=no
      # Transfers only with the TSIG key (TSIG-ALLOW-AXFR, infra/README.md step 4).
      # allow-axfr-ips is left EMPTY on purpose: an address listed here may AXFR
      # without TSIG, so listing ns2 would make the key optional. The CI harness
      # (infra/test/pdns-ci.sh) asserts an unsigned AXFR is refused.
      allow-axfr-ips=
      also-notify=10.53.1.12
      only-notify=10.53.1.12/32
      disable-axfr=no

      # RFC 2136 updates exist for one purpose only: the ACME DNS-01 TXT record at
      # _acme-challenge.runs-at.dev, signed with the acme-runs-at-dev TSIG key (see
      # acme-update-policy.lua, which is the complete policy). The edge renews its
      # certificate this way and never holds the API key.
      dnsupdate=yes
      lua-dnsupdate-policy-script=/etc/powerdns/acme-update-policy.lua

      # HTTP API for automation: loopback only, reach it over an SSH tunnel.
      api=yes
      webserver=yes
      webserver-address=127.0.0.1
      webserver-port=8081
      webserver-allow-from=127.0.0.1/32

      default-soa-content=ns1.runs-at.dev. hostmaster.@ 0 3600 600 1209600 300
      # The apex is an ALIAS to the Vercel target (Cloudflare served it as a
      # flattened CNAME). PowerDNS resolves ALIAS targets through this resolver at
      # query time; 169.254.169.254 is the OCI VCN resolver.
      resolver=169.254.169.254
      expand-alias=yes
      version-string=anonymous
      loglevel=4
      log-dns-queries=no
      include-dir=/etc/powerdns/pdns.d
  - path: /etc/powerdns/acme-update-policy.lua
    permissions: '0644'
    defer: true
    content: |
      -- RFC 2136 update policy for ns1 (lua-dnsupdate-policy-script).
      --
      -- The only dynamic update the zone accepts is the ACME DNS-01 challenge for
      -- the wildcard/apex certificate: a TXT record at _acme-challenge.runs-at.dev,
      -- signed with the dedicated TSIG key acme-runs-at-dev. Everything else is
      -- refused: other names, other types, unsigned updates, other keys.
      --
      -- With this script set, PowerDNS ignores allow-dnsupdate-from,
      -- ALLOW-DNSUPDATE-FROM and TSIG-ALLOW-DNSUPDATE: this function is the whole
      -- policy, so it checks the key itself. The update reaches ns2 through the
      -- normal NOTIFY/TSIG AXFR path.
      -- DNSName:equal() takes a string in PowerDNS 4.8.
      local ALLOWED_KEY = "acme-runs-at-dev."
      local ALLOWED_NAME = "_acme-challenge.runs-at.dev."

      function updatepolicy(input)
        local key = input:getTsigName()
        if key == nil or not key:equal(ALLOWED_KEY) then
          return false
        end
        if not input:getQName():equal(ALLOWED_NAME) then
          return false
        end
        -- TXT add/delete; also ANY for "delete all TXT at the name" cleanups.
        local t = input:getQType() -- a number in 4.8 (16 = TXT, 255 = ANY)
        return t == 16 or t == 255
      end
  - path: /usr/local/sbin/setup-pdns.sh
    permissions: '0750'
    defer: true
    content: |
      #!/bin/bash
      # First-boot setup for ns1. Idempotent. Generates every secret on the host;
      # none is ever written to the repo or to cloud-init user data.
      set -euo pipefail
      umask 077
      SECRETS=/etc/powerdns/pdns.d/secrets.conf

      # PostgreSQL: loopback only.
      PGCONF=$(ls -d /etc/postgresql/*/main | head -1)
      sed -i "s/^#\?listen_addresses.*/listen_addresses = 'localhost'/" "$PGCONF/postgresql.conf"
      systemctl restart postgresql

      if [ ! -f "$SECRETS" ]; then
        DBPASS=$(openssl rand -hex 24)
        APIKEY=$(openssl rand -hex 32)
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE pdns LOGIN PASSWORD '$DBPASS';"
        sudo -u postgres createdb -O pdns pdns
        PGPASSWORD=$DBPASS psql -h 127.0.0.1 -U pdns -d pdns -v ON_ERROR_STOP=1 \
          -f /usr/share/pdns-backend-pgsql/schema/schema.pgsql.sql
        printf 'gpgsql-password=%s\napi-key=%s\n' "$DBPASS" "$APIKEY" > "$SECRETS"
        chown root:pdns "$SECRETS"
        chmod 0640 "$SECRETS"
        # For pg_dump in pdns-backup.sh.
        printf '127.0.0.1:5432:pdns:pdns:%s\n' "$DBPASS" > /root/.pgpass
        chmod 0600 /root/.pgpass
      fi

      systemctl daemon-reload
      systemctl enable pdns
      systemctl restart pdns

      # TSIG key for transfers to ns2; copied to ns2 by hand (infra/README.md).
      pdnsutil list-tsig-keys | grep -q '^xfr-runs-at-dev\.' || pdnsutil generate-tsig-key xfr-runs-at-dev hmac-sha256 >/dev/null

      # TSIG key for the edge's ACME DNS-01 updates (acme-update-policy.lua allows
      # it to touch only TXT at _acme-challenge.runs-at.dev). Copy it to the edge.
      pdnsutil list-tsig-keys | grep -q '^acme-runs-at-dev.' || pdnsutil generate-tsig-key acme-runs-at-dev hmac-sha256 >/dev/null
  - path: /etc/systemd/system/pdns.service.d/override.conf
    permissions: '0644'
    defer: true
    content: |
      # /etc/systemd/system/pdns.service.d/override.conf
      [Service]
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectControlGroups=yes
      ProtectClock=yes
      ProtectHostname=yes
      RestrictSUIDSGID=yes
      RestrictRealtime=yes
      RestrictNamespaces=yes
      LockPersonality=yes
      MemoryDenyWriteExecute=yes
      SystemCallArchitectures=native
      RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN
      ReadWritePaths=/var/lib/powerdns /run/pdns
      Restart=on-failure
      RestartSec=2
  - path: /usr/local/sbin/pdns-backup.sh
    permissions: '0750'
    defer: true
    content: |
      #!/bin/bash
      # Nightly: database dump + BIND export of every zone, with checksums. Keeps 14 days.
      set -euo pipefail
      umask 077
      DIR=/var/backups/pdns
      STAMP=$(date -u +%Y%m%dT%H%M%SZ)
      mkdir -p "$DIR"
      if command -v pg_dump >/dev/null && [ -f /root/.pgpass ]; then
        pg_dump -h 127.0.0.1 -U pdns -Fc pdns > "$DIR/pdns-$STAMP.pgdump"
      fi
      if [ -f /var/lib/powerdns/pdns.sqlite3 ]; then
        sqlite3 /var/lib/powerdns/pdns.sqlite3 ".backup '$DIR/pdns-$STAMP.sqlite3'"
      fi
      for zone in $(pdnsutil list-all-zones); do
        pdnsutil list-zone "$zone" > "$DIR/$zone-$STAMP.zone"
      done
      (cd "$DIR" && sha256sum -- *"$STAMP"* > "SHA256SUMS-$STAMP")
      # Off-site copy: only when both files exist (/etc/pdns-backup, mode 0700).
      #   age-recipient  the owner's age PUBLIC key; the private key never lives here
      #   par-url        write-only pre-authenticated request for the private bucket
      # The bundle is encrypted before it leaves the host. The URL is passed to curl
      # on stdin (-K -), never as a command-line argument.
      CONF=/etc/pdns-backup
      if [ -s "$CONF/age-recipient" ] && [ -s "$CONF/par-url" ] && command -v age >/dev/null; then
        OBJ="backups/$(hostname -s)/pdns-$STAMP.tar.age"
        tar -C "$DIR" -cf - $(cd "$DIR" && ls -- *"$STAMP"*)       -C / etc/powerdns etc/cron.d/pdns-local     | age -R "$CONF/age-recipient" > "$DIR/offsite-$STAMP.tar.age"
        printf 'url = "%s%s"\nupload-file = "%s"\n' "$(cat "$CONF/par-url")" "$OBJ" "$DIR/offsite-$STAMP.tar.age" \
          | curl -sS -f -K - -o /dev/null
        echo "$(date -u +%FT%TZ) offsite ok $OBJ sha256 $(sha256sum "$DIR/offsite-$STAMP.tar.age" | cut -c1-64)"
        rm -f "$DIR/offsite-$STAMP.tar.age"
      fi
      find "$DIR" -type f -mtime +14 -delete
      echo "$(date -u +%FT%TZ) backup ok $STAMP"
  - path: /usr/local/sbin/check-dns.sh
    permissions: '0755'
    defer: true
    content: |
      #!/bin/bash
      # Compare SOA serials on ns1 and ns2 and check both answer over UDP and TCP.
      # Exit 0 healthy, 1 unhealthy, 2 missing tool. Needs dig (bind9-dnsutils).
      #   NS1=<ip> NS2=<ip> check-dns.sh [zone]
      set -uo pipefail
      ZONE=${1:-runs-at.dev}
      NS1=${NS1:-ns1.runs-at.dev}
      NS2=${NS2:-ns2.runs-at.dev}
      MAX_LAG=${MAX_LAG:-0}
      command -v dig >/dev/null || { echo "check-dns: dig not installed" >&2; exit 2; }

      serial() { dig +short +norecurse +time=3 +tries=2 "$@" SOA "$ZONE" | awk '{print $3}'; }

      fail=0
      s1=""
      s2=""
      for ns in "$NS1" "$NS2"; do
        for proto in notcp tcp; do
          s=$(serial "@$ns" "+$proto")
          if ! [[ $s =~ ^[0-9]+$ ]]; then
            echo "$(date -u +%FT%TZ) FAIL $ns $proto: no SOA answer"
            fail=1
            continue
          fi
          echo "$(date -u +%FT%TZ) ok   $ns $proto serial $s"
          if [ "$ns" = "$NS1" ]; then s1=$s; else s2=$s; fi
        done
      done

      if [ -n "$s1" ] && [ -n "$s2" ]; then
        diff=$((s1 - s2))
        [ "$diff" -lt 0 ] && diff=$((-diff))
        if [ "$diff" -gt "$MAX_LAG" ]; then
          echo "$(date -u +%FT%TZ) FAIL serial mismatch $NS1=$s1 $NS2=$s2"
          fail=1
        else
          echo "$(date -u +%FT%TZ) ok   serials match ($s1)"
        fi
      fi
      exit $fail
  - path: /etc/cron.d/pdns-local
    permissions: '0644'
    defer: true
    content: |
      # /etc/cron.d/pdns-local
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      17 3 * * * root /usr/local/sbin/pdns-backup.sh >> /var/log/pdns-backup.log 2>&1
      */5 * * * * root NS1=10.53.1.11 NS2=10.53.1.12 /usr/local/sbin/check-dns.sh >> /var/log/check-dns.log 2>&1
  - path: /etc/logrotate.d/pdns-local
    permissions: '0644'
    defer: true
    content: |
      # /etc/logrotate.d/pdns-local (pdns itself logs to journald)
      /var/log/pdns-backup.log /var/log/check-dns.log {
          weekly
          rotate 8
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root adm
      }
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    permissions: '0644'
    defer: true
    content: |
      // /etc/apt/apt.conf.d/52unattended-upgrades-local
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
runcmd:
  - [sh, -c, 'mkdir -p /etc/systemd/resolved.conf.d && printf "[Resolve]\nDNSStubListener=no\n" > /etc/systemd/resolved.conf.d/no-stub.conf && ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf && systemctl restart systemd-resolved']
  - [sh, -c, 'for p in udp tcp; do iptables -C INPUT -p $p --dport 53 -j ACCEPT 2>/dev/null || iptables -I INPUT 5 -p $p --dport 53 -j ACCEPT; done; netfilter-persistent save']
  - [rm, -f, /etc/powerdns/pdns.d/bind.conf]
  - [chown, root:pdns, /etc/powerdns/pdns.conf]
  - [/usr/local/sbin/setup-pdns.sh]
