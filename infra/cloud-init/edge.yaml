#cloud-config
# edge.runs-at.dev - GENERATED by infra/cloud-init/build.mjs; edit infra/powerdns or infra/monitoring instead.
# Contains no secrets: they are generated on the host or supplied by the operator.
hostname: edge
package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - bind9-dnsutils
  - openssl
  - age
  - caddy
  - lego
  - curl
write_files:
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    defer: true
    content: |
      # Wildcard edge for *.runs-at.dev once DNS leaves Cloudflare. Replaces
      # cloudflare/worker.js (and the Cloudflare proxy in front of it) with the same
      # behaviour:
      #
      #   GET/HEAD /       -> the app's /_card/<name>, query kept, visitor cookies
      #                       NOT forwarded, Set-Cookie stripped, upstream redirects
      #                       (URL records) passed through as redirects
      #   any other path   -> 307 to https://runs-at.dev<path>?<query>
      #   other methods    -> 405, Allow: GET, HEAD
      #   multi-label/www  -> 404 here (they have their own DNS records; under
      #                       Cloudflare these fell through to the zone origin)
      #
      # Names with their own DNS records (CNAME/A to their host) never reach this
      # edge, exactly as DNS-only records never reached the Worker.
      #
      # TLS: one wildcard certificate obtained by DNS-01 against our own PowerDNS
      # (infra/edge/renew-cert.sh), read from files, so this file runs on stock
      # Caddy without plugins. Environment:
      #   APP_ORIGIN  upstream app, default https://runs-at.dev
      #   APP_HOST    Host header sent upstream, default runs-at.dev
      #   TLS_CERT / TLS_KEY  wildcard certificate files
      {
      	admin off
      	auto_https disable_redirects
      	# HTTP/1.1 and HTTP/2 only: no UDP listener (HTTP/3) next to DNS.
      	servers {
      		protocols h1 h2
      	}
      	# Plain-text access log to stdout (journald, rotated by journald limits).
      	log {
      		output stdout
      		format console
      	}
      }

      # Routing shared by HTTPS and plain HTTP.
      (edge_routes) {

      	# Only single-label names are cards. www and deeper names are not ours.
      	@multilabel header_regexp Host ^(www\.runs-at\.dev|[^.]+\.[^.]+\.runs-at\.dev)(:\d+)?$
      	handle @multilabel {
      		respond "not found" 404
      	}

      	@badmethod not method GET HEAD
      	handle @badmethod {
      		header Allow "GET, HEAD"
      		respond "method not allowed" 405
      	}

      	@front path /
      	handle @front {
      		rewrite * /_card/{labels.2}{uri}
      		uri replace /_card/{labels.2}/ /_card/{labels.2}
      		reverse_proxy {$APP_ORIGIN:https://runs-at.dev} {
      			header_up Host {$APP_HOST:runs-at.dev}
      			# Forward only what the card needs, never visitor cookies.
      			header_up -Cookie
      			header_up -Authorization
      			header_down -Set-Cookie
      		}
      	}

      	handle {
      		redir https://runs-at.dev{uri} 307
      	}
      }

      *.runs-at.dev:{$EDGE_PORT:443} {
      	tls {$TLS_CERT:/etc/runs-at-edge/tls/wildcard.crt} {$TLS_KEY:/etc/runs-at-edge/tls/wildcard.key}
      	import edge_routes
      }

      # Plain HTTP serves the same responses: the Cloudflare Worker answered cards
      # over http:// too, without redirecting to https.
      http://*.runs-at.dev:{$EDGE_HTTP_PORT:80} {
      	import edge_routes
      }

      # Any other host on plain HTTP (e.g. a.b.runs-at.dev, bare IP): 404 instead
      # of Caddy's default empty 200.
      http://:{$EDGE_HTTP_PORT:80} {
      	respond "not found" 404
      }
  - path: /usr/local/sbin/renew-cert.sh
    permissions: '0750'
    defer: true
    content: |
      #!/bin/bash
      # Obtain or renew the *.runs-at.dev wildcard certificate for infra/edge/Caddyfile
      # with an ACME DNS-01 challenge, written to ns1 as an RFC 2136 dynamic update
      # (lego's "rfc2136" provider) signed with the acme-runs-at-dev TSIG key. ns1's
      # acme-update-policy.lua lets that key change only TXT at
      # _acme-challenge.runs-at.dev, so the edge never holds the PowerDNS API key.
      # Runs on the edge host from cron.
      #
      # Needs on the edge: lego (https://go-acme.github.io/lego/), caddy, and
      # /etc/runs-at-edge/acme-tsig.env with RFC2136_NAMESERVER (ns1's private
      # address:53), RFC2136_TSIG_KEY=acme-runs-at-dev., RFC2136_TSIG_SECRET and
      # RFC2136_TSIG_ALGORITHM=hmac-sha256. (mode 0600, copied from ns1.)
      # ACME_EMAIL is the Let's Encrypt account contact: a REAL value the operator
      # must provide; there is no default.
      set -euo pipefail
      umask 077
      : "${ACME_EMAIL:?set ACME_EMAIL to the operator contact address}"
      DIR=/etc/runs-at-edge
      LEGO_DIR=/var/lib/lego
      mkdir -p "$DIR" "$LEGO_DIR"

      set -a
      . "$DIR/acme-tsig.env"
      set +a
      export RFC2136_PROPAGATION_TIMEOUT=300 RFC2136_POLLING_INTERVAL=10

      # ACME_SERVER: optional, e.g. Let's Encrypt staging for a dry run.
      args=(${ACME_SERVER:+--server "$ACME_SERVER"} --accept-tos --path "$LEGO_DIR" --email "$ACME_EMAIL" --dns rfc2136 --domains '*.runs-at.dev')
      if [ -f "$LEGO_DIR/certificates/_.runs-at.dev.crt" ]; then
        lego "${args[@]}" renew --days 30
      else
        lego "${args[@]}" run
      fi

      # Caddy reads only the certificate directory (group caddy); it cannot see
      # $LEGO_DIR or the ACME key (InaccessiblePaths in caddy-override.conf).
      install -d -m 0750 -g caddy "$DIR/tls"
      install -m 0644 "$LEGO_DIR/certificates/_.runs-at.dev.crt" "$DIR/tls/wildcard.crt"
      install -m 0640 -g caddy "$LEGO_DIR/certificates/_.runs-at.dev.key" "$DIR/tls/wildcard.key"
      systemctl restart caddy
  - path: /etc/cron.d/runs-at-edge
    permissions: '0644'
    defer: true
    content: |
      # /etc/cron.d/runs-at-edge
      # Renew the wildcard certificate daily (lego renews only within 30 days of
      # expiry). ACME_EMAIL lives in /etc/runs-at-edge/acme.env (operator-supplied);
      # without it the job does nothing.
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      17 4 * * * root [ -s /etc/runs-at-edge/acme.env ] && { set -a; . /etc/runs-at-edge/acme.env; set +a; /usr/local/sbin/renew-cert.sh >> /var/log/runs-at-edge-renew.log 2>&1; }
      # Health every minute: HTTPS and HTTP must answer locally; DNS must still answer.
      * * * * * root /usr/local/sbin/edge-health.sh >> /var/log/runs-at-edge-health.log 2>&1
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    permissions: '0644'
    defer: true
    content: |
      // /etc/apt/apt.conf.d/52unattended-upgrades-local
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
runcmd:
  - [sh, -c, 'for p in 80 443; do iptables -C INPUT -p tcp --dport $p -j ACCEPT 2>/dev/null || iptables -I INPUT 5 -p tcp --dport $p -j ACCEPT; done; netfilter-persistent save']
  - [mkdir, -p, -m, "0750", /etc/runs-at-edge]
  - [chgrp, caddy, /etc/runs-at-edge]
  - [systemctl, disable, --now, caddy]
