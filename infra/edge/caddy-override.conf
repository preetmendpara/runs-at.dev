# /etc/systemd/system/caddy.service.d/runs-at-edge.conf
#
# Caddy shares ns2 with the PowerDNS secondary. DNS comes first: Caddy gets
# a hard memory cap and a CPU share below pdns, and it cannot see PowerDNS's
# configuration, database, backups or the ACME key.
[Service]
# --environ in the stock unit would print the environment; drop it.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
# admin is off in the Caddyfile, so reload = restart.
ExecReload=
ExecReload=/bin/systemctl restart caddy

# Resources (ns2: 1/8 OCPU burstable to 2 vCPU, 952 MB RAM).
MemoryHigh=160M
MemoryMax=220M
MemorySwapMax=0
CPUWeight=20
CPUQuota=80%
TasksMax=256
Nice=5
IOWeight=20
LimitNOFILE=16384
Restart=on-failure
RestartSec=3

# Sandboxing.
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
UMask=0077
# PowerDNS, its database, backups and the ACME key are invisible to Caddy.
InaccessiblePaths=-/etc/powerdns -/var/lib/powerdns -/etc/pdns-backup -/var/backups/pdns -/root -/etc/runs-at-edge/acme-tsig.env -/etc/runs-at-edge/acme.env -/var/lib/lego
