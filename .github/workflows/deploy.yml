name: deploy

# Vercel's own Git integration is switched off in vercel.json. It used to open a
# deployment for every pull request, and because the preview environment carries
# real secrets (REGISTRY_TOKEN among them) Vercel rightly refused to build a fork
# without authorization — leaving a permanent red "Authorization required to
# deploy" on every contributor's PR. Turning fork protection off instead would
# have handed arbitrary PR code the token that writes domains/, so deployment
# moved here, where only main can trigger it.
on:
  push:
    branches: [main]
    # Registry data pushes (claims, record edits, the owners index, docs)
    # change nothing the site serves, but each one used to build and upload
    # the full app anyway. The day the registry got busy that burned through
    # Vercel's free-tier upload quota ("api-upload-paid, more than 40000")
    # and every deploy after it failed while claims kept landing. Data
    # commits no longer deploy at all; the schedule below and
    # workflow_dispatch remain the paths for forcing one.
    #
    # /stats is the one page that reads domains/ at build time rather than
    # through the runtime API, so it depends on a deploy to stay fresh. The
    # daily schedule covers it: the numbers are never more than a day stale,
    # which costs one deploy instead of one per claim.
    # `.moderation/**` joins them for the same reason: the spam log is
    # evidence, not application code, and a burst of spam should not spend
    # the deploy budget. `sites/**` is registry data too (hosted-site
    # pointers, written per deploy), so it never triggers a build either.
    paths-ignore: ['domains/**', 'owners/**', 'data/**', 'docs/**', '.moderation/**', 'sites/**', '*.md', '!content/**']
  schedule:
    # Daily at 04:00 UTC (blog content changes always deploy: content/** is
    # un-ignored below, so a new post ships without waiting for the next day), off the top of the hour so it doesn't co-fire with
    # the health check. Rebuilds /stats from the current state of domains/.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The IDs are handed only to the two steps below, never to the vercel
    # commands: those read the link written by "Link Vercel project", so an
    # org id naming the wrong account cannot override it.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      # Ask the API first so the log says which value is empty or wrong.
      # Nothing secret is printed.
      - name: Check Vercel project access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=''
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN(secret)"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID(variable)"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::empty:$missing. The IDs belong under Settings > Secrets and variables > Actions > Variables, the token under Secrets."
            exit 1
          fi
          # A pasted space, newline or quote makes the lookup URL malformed
          # (curl exits 3) and the CLI reports it as a missing project.
          bad=''
          for pair in "VERCEL_ORG_ID=$VERCEL_ORG_ID" "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"; do
            case "${pair#*=}" in *[!A-Za-z0-9_]*) bad="$bad ${pair%%=*}" ;; esac
          done
          if [ -n "$bad" ]; then
            echo "::error::extra characters in:$bad. Re-enter the value with only the ID itself: no spaces, quotes or line breaks."
            exit 1
          fi
          # Personal scopes have no team_ id; the CLI omits teamId for them too.
          case "$VERCEL_ORG_ID" in team_*) scope="?teamId=$VERCEL_ORG_ID" ;; *) scope='' ;; esac
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID$scope")
          case "$status" in
            200) echo "Vercel project found (org id starts ${VERCEL_ORG_ID%%_*}_, project id starts ${VERCEL_PROJECT_ID%%_*}_)." ;;
            401) echo "::error::Vercel rejected VERCEL_TOKEN (401): expired, revoked, or pasted incompletely."; exit 1 ;;
            403) echo "::error::Vercel refused VERCEL_TOKEN for that scope (403): the token is invalid or expired, is scoped to a different account/team, or VERCEL_ORG_ID is wrong."; exit 1 ;;
            404) echo "::error::No project $VERCEL_PROJECT_ID under that scope (404): VERCEL_PROJECT_ID is wrong, or VERCEL_ORG_ID names a different account/team."; exit 1 ;;
            *) echo "::error::Vercel API answered $status."; exit 1 ;;
          esac
      # Link explicitly: the owner and name come from the project itself, so
      # the link is right even if VERCEL_ORG_ID is not, and a mismatch is
      # reported so the variable can be fixed. The project name in the link
      # is what lets `vercel deploy` skip its remote lookups (see below).
      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          case "$VERCEL_ORG_ID" in team_*) scope="?teamId=$VERCEL_ORG_ID" ;; *) scope='' ;; esac
          curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID$scope" -o "$RUNNER_TEMP/project.json"
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/project.json", "utf8"));
            if (!p.id || !p.accountId) throw new Error("Vercel returned no project id/owner");
            if (p.accountId !== process.env.VERCEL_ORG_ID) {
              console.log("::warning::VERCEL_ORG_ID is not the project owner; linking to the owner (" + p.accountId.split("_")[0] + "_...) instead. Set VERCEL_ORG_ID to the Team ID of the team that owns the project.");
            }
            fs.mkdirSync(".vercel", { recursive: true });
            fs.writeFileSync(".vercel/project.json", JSON.stringify({ orgId: p.accountId, projectId: p.id, projectName: p.name }));
            console.log("Linked to Vercel project " + p.name + ".");
          '
      # Deploy the source and let Vercel build it with the project's own
      # settings and environment variables, as a dashboard deploy does.
      #
      # Not `vercel pull` + `vercel build` + `deploy --prebuilt`: pull (CLI
      # 59.26.0) also fetches the owning team (GET /teams/<id>) and turns a
      # 403 there into "Could not retrieve Project Settings", with no fallback,
      # even when the project itself is readable. `vercel build` cannot run
      # without what pull downloads. `vercel deploy` skips both lookups when
      # the link names the project, which the step above writes.
      - run: npx vercel@59.26.0 deploy --prod --yes --token='${{ secrets.VERCEL_TOKEN }}'
