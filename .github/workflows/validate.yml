name: validate

# Runs on EVERY pull request and always reports a `validate` check, so the
# check can be required on main without blocking pull requests that never
# touch the registry: those pass at the scope step and run nothing else.
#
# pull_request_target, not pull_request. With pull_request, GitHub runs the
# workflow file as it is in the pull request, so a pull request could rewrite
# this file to skip validation and then pass the very check that is meant to
# stop it. pull_request_target always runs this file from the base branch.
# That trigger is only safe because nothing from the pull request runs here:
# every checkout below is the base branch, and the validator reads the pull
# request's files over the API as data.
#
# workflow_dispatch is the fresh-run path for revalidate-prs.yml, used when a
# PR's last validate run is too old for GitHub to re-run (30 days). A
# dispatched run is NOT attached to the pull request: its own job check lands
# on the commit the workflow ran from, and GitHub does not count it toward the
# PR's required checks. So the dispatch path publishes the result itself, as
# a `validate` check run on the PR's head commit through the Checks API:
#
#   open     (dispatch only)  resolves the PR, creates the check in_progress
#   validate (both events)    the validation itself, read-only token
#   close    (dispatch only)  completes that same check run with the result
#
# Only `open` and `close` hold checks: write; the job that installs and runs
# code has a read-only token, as before.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  open:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      check_id: ${{ steps.check.outputs.id }}
    steps:
      # Exact head commit, read from the API at dispatch time. Everything
      # below validates this SHA and reports on this SHA, even if the PR is
      # pushed again meanwhile (that push gets its own pull_request_target run).
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$INPUT_PR" in ''|*[!0-9]*) echo "::error::pr input must be a number"; exit 1;; esac
          pr=$(gh api "repos/$REPO/pulls/$INPUT_PR")
          state=$(jq -r .state <<< "$pr")
          base_ref=$(jq -r .base.ref <<< "$pr")
          if [ "$state" != "open" ]; then echo "::error::PR #$INPUT_PR is $state"; exit 1; fi
          if [ "$base_ref" != "$DEFAULT_BRANCH" ]; then echo "::error::PR #$INPUT_PR targets $base_ref, not $DEFAULT_BRANCH"; exit 1; fi
          {
            echo "number=$(jq -r .number <<< "$pr")"
            echo "base_ref=$base_ref"
            echo "base_sha=$(jq -r .base.sha <<< "$pr")"
            echo "head_sha=$(jq -r .head.sha <<< "$pr")"
          } >> "$GITHUB_OUTPUT"
      # One check run per dispatch, created in_progress now and completed by
      # `close`, so a stale green check never sits on the commit while the
      # re-validation runs. GitHub reports the newest `validate` run per commit.
      - name: Open validate check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/check-runs" -X POST \
            -f name=validate -f head_sha="$HEAD_SHA" -f status=in_progress \
            -f details_url="$RUN_URL" \
            -f "output[title]=validate (re-validating)" \
            -f "output[summary]=Fresh re-validation started by revalidate-prs: $RUN_URL" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  validate:
    needs: open
    # Runs for pull_request_target (where `open` is skipped) and for dispatch
    # once `open` succeeded.
    if: always() && (needs.open.result == 'success' || (github.event_name == 'pull_request_target' && needs.open.result == 'skipped'))
    # The required check is this job's name on pull_request_target. On
    # dispatch the job check lands on the default branch's commit, so it gets
    # a different name there and never passes for the PR's `validate`.
    name: "${{ github.event_name == 'workflow_dispatch' && format('revalidate PR #{0}', inputs.pr) || 'validate' }}"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      # The pull request this run judges: from the event payload for
      # pull_request_target, from `open` for a dispatched re-validation.
      - name: Resolve pull request
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPEN_PR: ${{ needs.open.outputs.number }}
          OPEN_BASE_REF: ${{ needs.open.outputs.base_ref }}
          OPEN_BASE_SHA: ${{ needs.open.outputs.base_sha }}
          OPEN_HEAD_SHA: ${{ needs.open.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_PR" ]; then
            { echo "number=$EVENT_PR"; echo "base_ref=$EVENT_BASE_REF"; echo "base_sha=$EVENT_BASE_SHA"; echo "head_sha=$EVENT_HEAD_SHA"; } >> "$GITHUB_OUTPUT"
          else
            { echo "number=$OPEN_PR"; echo "base_ref=$OPEN_BASE_REF"; echo "base_sha=$OPEN_BASE_SHA"; echo "head_sha=$OPEN_HEAD_SHA"; } >> "$GITHUB_OUTPUT"
          fi
      # Registry pull requests are the ones that touch domains/ or
      # entitlements/. Anything else is not this check's business.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(domains|entitlements)/'; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
            echo "Registry pull request: running registry validation."
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"
            echo "No changes under domains/ or entitlements/: nothing to validate."
          fi
      # Check out the BASE branch, never the PR's merge commit, so the job runs
      # the base copy of lib/pr.js and scripts/validate-pr.mjs -- a PR that
      # rewrites validateChangeset to return { ok: true } cannot approve itself.
      #
      # `base.ref` (the branch tip) rather than `base.sha` (the branch as of the last PR
      # event): both are trusted content, but base.sha is frozen in the stored event payload,
      # so a re-run of an old PR keeps executing the validator as it was when the PR opened.
      # BASE_SHA below stays base.sha -- "what does the record look like under this PR" is
      # a question about the PR, and must not drift while the PR is being reviewed.
      - if: steps.scope.outputs.registry == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          persist-credentials: false
      # The registry as it is on the base branch NOW, for counting the names and
      # slots the author already holds. A second, sparse checkout so the data it
      # counts is fetched separately from the validator code above. Counting from
      # disk replaces the Contents API, which lists at most 1,000 files per
      # directory and cost one request per record.
      #
      # `base.ref` (the branch tip when this job runs), not `base.sha` (the tip
      # when the PR was last pushed): base.sha is frozen in the event payload, so
      # a pass computed against it goes stale the moment the same account claims
      # a name on the website. Counting at the live tip means every run, and every
      # re-run -- revalidate-prs.yml and pr-slots.yml re-run this job when the
      # registry or a reservation changes -- judges the PR against the allowance
      # as it stands at that moment.
      - if: steps.scope.outputs.registry == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          path: .base-registry
          # entitlements/ is the per-account allowance, read at the same commit.
          sparse-checkout: |
            domains
            entitlements
          persist-credentials: false
      - if: steps.scope.outputs.registry == 'true'
        name: Registry state counted
        run: echo "Counting domains/ and entitlements/ at $(git -C .base-registry rev-parse HEAD)"
      - if: steps.scope.outputs.registry == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - if: steps.scope.outputs.registry == 'true'
        id: install
        # On dispatch a failure is reported on the PR by `close`; keep the
        # job check on the default branch commit from turning red.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci
      - if: steps.scope.outputs.registry == 'true' && steps.install.outcome == 'success'
        id: test
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm test
      - if: steps.scope.outputs.registry == 'true' && steps.test.outcome == 'success'
        id: check
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/validate-pr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REGISTRY_CHECKOUT: .base-registry
      # "success" only when every registry step passed or the PR is out of
      # scope; `close` treats anything else as a failure.
      - name: Result
        id: result
        env:
          REGISTRY: ${{ steps.scope.outputs.registry }}
          INSTALL: ${{ steps.install.outcome }}
          TEST: ${{ steps.test.outcome }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          result=failure
          if [ "$REGISTRY" = "false" ]; then result=success
          elif [ "$INSTALL" = "success" ] && [ "$TEST" = "success" ] && [ "$CHECK" = "success" ]; then result=success; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "validation result: $result"
          [ "$result" = "success" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || exit 1

  close:
    needs: [open, validate]
    if: always() && github.event_name == 'workflow_dispatch' && needs.open.outputs.check_id != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # Completes the check run `open` created (same id: no duplicate). Any
      # outcome other than a validate job that reached its last step is a
      # failure, including a cancelled or errored run.
      - name: Complete validate check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ needs.open.outputs.check_id }}
          RESULT: ${{ needs.validate.outputs.result }}
          JOB_RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          conclusion=failure
          if [ "$RESULT" = "success" ] && [ "$JOB_RESULT" = "success" ]; then conclusion=success; fi
          gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=validate ($conclusion)" \
            -f "output[summary]=Fresh re-validation by revalidate-prs ($JOB_RESULT): $RUN_URL" > /dev/null
          echo "validate check $CHECK_ID: $conclusion"
