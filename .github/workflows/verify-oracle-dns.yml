name: verify-oracle-dns

# Read-only check of the Oracle-hosted ns1/ns2 from outside Oracle's network:
# every declared record over UDP and TCP on both servers, SOA serials, and
# that zone transfers without TSIG are refused. Sends DNS queries only.
# The addresses come from the repository variables PDNS_PRIMARY_IP and
# PDNS_SECONDARY_IPS (public glue addresses, not secrets).
on:
  push:
    branches: [feat/powerdns-migration]
    paths:
      - .github/workflows/verify-oracle-dns.yml
      - infra/cloud-init/**
      - migration/ORACLE_DEPLOYMENT.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check both servers
        env:
          NS1: ${{ vars.PDNS_PRIMARY_IP }}
          NS2: ${{ vars.PDNS_SECONDARY_IPS }}
        run: |
          set -euo pipefail
          for ip in "$NS1" "$NS2"; do [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "bad IP"; exit 1; }; done
          {
            echo '## Oracle ns1/ns2 from a GitHub runner'
            echo '```'
            for ip in "$NS1" "$NS2"; do
              echo "SOA $ip: $(dig @"$ip" +short +norec runs-at.dev SOA | awk '{print $3}')"
              echo "AA flag $ip: $(dig @"$ip" +norec runs-at.dev SOA | grep -c 'flags:.* aa')"
              echo "apex A on $ip: $(dig @"$ip" +short +norec runs-at.dev A | grep -cE '^[0-9.]+$') address(es)"
              axfr=$(dig @"$ip" +tcp runs-at.dev AXFR | grep -cE 'IN[[:space:]]+SOA' || true)
              echo "unsigned AXFR SOA lines from $ip: $axfr (0 = refused)"
            done
            node infra/test/check-servers.mjs "$NS1:53" "$NS2:53"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
